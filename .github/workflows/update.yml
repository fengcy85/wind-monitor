name: Update wind news and deploy

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 08:00
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wind-monitor-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache offline translation models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-v44-${{ runner.os }}-py311-en-vi-pt-it-ar-zh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Scrape wind news
        env:
          ENABLE_TRANSLATION: "1"
          MAX_TRANSLATIONS_PER_RUN: "240"
          SOURCE_TIME_BUDGET_SECONDS: "70"
          REQUEST_TIMEOUT: "15"
          BROWSER_TIMEOUT_MS: "22000"
        run: |
          python scrape.py

      - name: Save updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          git diff --cached --quiet || git commit -m "Update wind news"
          git pull --rebase origin main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}

